<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
<defs>
<clipPath id="c"><rect width="840" height="280" rx="18"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#6d28d9"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.6"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'}
.b{transform-box:fill-box;transform-origin:center}
.b1{animation:m1 13s ease-in-out infinite alternate}.b2{animation:m2 17s ease-in-out infinite alternate}
.b3{animation:m3 11s ease-in-out infinite alternate}.b4{animation:m4 19s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(260px,70px) scale(1.25)}}
@keyframes m2{to{transform:translate(-280px,-60px) scale(.85)}}
@keyframes m3{to{transform:translate(-160px,110px) scale(1.3)}}
@keyframes m4{to{transform:translate(200px,-90px) scale(1.1)}}
.s{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}
.shoot{animation:sh 7s linear infinite}
@keyframes sh{0%,82%{transform:translate(0,0);opacity:0}84%{opacity:1}96%,100%{transform:translate(-340px,170px);opacity:0}}
.wave{transform-box:fill-box;transform-origin:70% 80%;animation:wv 2.6s ease-in-out infinite}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.n{display:none}
@media (max-width:560px){.w{display:none}.n{display:inline}}
@media (prefers-reduced-motion:reduce){.b,.s,.shoot,.wave{animation:none}}
</style>
<g clip-path="url(#c)">
<rect width="840" height="280" fill="#f8fafc"/>
<g filter="url(#blur)" opacity="0.9">
<circle class="b b1" cx="110" cy="40" r="130" fill="#c4b5fd"/>
<circle class="b b2" cx="720" cy="250" r="150" fill="#7dd3fc"/>
<circle class="b b3" cx="520" cy="10" r="105" fill="#f9a8d4"/>
<circle class="b b4" cx="300" cy="300" r="95" fill="#86efac"/>
</g>


<g class="w">
<text x="56" y="112" style="font-size:52px;font-weight:800;letter-spacing:-1.5px;fill:url(#ink)">Hi, I'm yamamoto7</text>
<text x="512" y="110" style="font-size:44px" class="wave">👋</text>
<text x="58" y="158" style="font-size:19px;fill:rgba(15,23,42,.66)">Software engineer. I fix things in open source.</text>
<g transform="translate(56 196)"><rect width="44.4" height="30" rx="15" fill="rgba(255,255,255,.55)" stroke="rgba(15,23,42,.10)"/><text x="22.2" y="20" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#334155">Go</text></g><g transform="translate(110.4 196)"><rect width="77.19999999999999" height="30" rx="15" fill="rgba(255,255,255,.55)" stroke="rgba(15,23,42,.10)"/><text x="38.599999999999994" y="20" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#334155">Kotlin</text></g><g transform="translate(197.6 196)"><rect width="110" height="30" rx="15" fill="rgba(255,255,255,.55)" stroke="rgba(15,23,42,.10)"/><text x="55" y="20" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#334155">TypeScript</text></g><g transform="translate(317.6 196)"><rect width="118.19999999999999" height="30" rx="15" fill="rgba(255,255,255,.55)" stroke="rgba(15,23,42,.10)"/><text x="59.099999999999994" y="20" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#334155">Open source</text></g>
</g>
<g class="n">
<text x="420" y="132" text-anchor="middle" style="font-size:96px;font-weight:800;letter-spacing:-3px;fill:url(#ink)">yamamoto7</text>
<text x="420" y="206" text-anchor="middle" style="font-size:40px;fill:rgba(15,23,42,.66)">Software engineer 👋</text>
</g>
</g>
<rect x=".75" y=".75" width="838.5" height="278.5" rx="17.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>