<text x="28" y="141" class="m" opacity="0" style="animation:show 0s 4.6s forwards" xml:space="preserve"><tspan fill="#3fb950">✓ </tspan><tspan fill="#79c0ff">grpc-ecosystem/grpc-gateway  </tspan><tspan fill="#d2a8ff">#7653  </tspan><tspan fill="#c9d1d9">support optional enum path params</tspan></text>
