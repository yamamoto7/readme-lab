</g>
<text x="28" y="91" class="m" opacity="0" style="animation:show 0s 1.5s forwards" xml:space="preserve"><tspan fill="#e6edf3">yamamoto7</tspan><tspan fill="#8b949e"> — software engineer, contributing to open source</tspan></text>
<g style="animation:show 0s 2.3s forwards" opacity="0">
