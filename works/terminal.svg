<text x="28" y="191" class="m" opacity="0" style="animation:show 0s 5.16s forwards" xml:space="preserve"><tspan fill="#3fb950">✓ </tspan><tspan fill="#79c0ff">axllent/mailpit              </tspan><tspan fill="#d2a8ff">#768   </tspan><tspan fill="#c9d1d9">accept `latest` as the message ID</tspan></text>
<text x="28" y="216" class="m" opacity="0" style="animation:show 0s 5.4399999999999995s forwards" xml:space="preserve"><tspan fill="#3fb950">✓ </tspan><tspan fill="#79c0ff">detekt/detekt                </tspan><tspan fill="#d2a8ff">#9870  </tspan><tspan fill="#c9d1d9">CouldBeSequence after toList()</tspan></text>
<text x="28" y="241" class="m" opacity="0" style="animation:show 0s 5.72s forwards" xml:space="preserve"><tspan fill="#3fb950">✓ </tspan><tspan fill="#79c0ff">grafana/mcp-grafana          </tspan><tspan fill="#d2a8ff">#1496  </tspan><tspan fill="#c9d1d9">apply limitPerMetric to metadata</tspan></text>
